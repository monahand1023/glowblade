<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>lightsaber_fx</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <h1>lightsaber_fx</h1>

  <div id="dropzone">Drag and drop a video here, or click to choose a file</div>
  <input type="file" id="file-input" accept="video/mp4" hidden>

  <div id="picker-section" hidden>
    <p>Click the object to track. Shift-click to exclude a spot (e.g. a hand).</p>
    <canvas id="picker-canvas"></canvas>
  </div>

  <div id="controls-section" hidden>
    <div id="controls">
      <label>Color:
        <select id="color-select">
          <option value="red">Red</option>
          <option value="blue">Blue</option>
          <option value="green">Green</option>
        </select>
      </label>
      <label>Intensity:
        <input type="range" id="intensity-input" min="0" max="1" step="0.05" value="0.35">
      </label>
      <label>Voice:
        <select id="voice-select">
          <option value="neutral">Neutral</option>
          <option value="jedi">Jedi</option>
          <option value="sith">Sith</option>
        </select>
      </label>
      <label>
        <input type="checkbox" id="blade-extend-input" checked>
        Extend blade
      </label>
      <button id="submit-button" disabled>Track &amp; Render</button>
      <button id="rerender-button" hidden>Re-render</button>
    </div>
  </div>

  <div id="progress-section" hidden>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <p id="progress-label"></p>
  </div>

  <div id="result-section" hidden>
    <video id="result-player" controls></video>
    <a id="download-link" download="final.mp4">Download</a>
    <p id="rerender-hint">Not the right look? Adjust color/intensity/voice above and click Re-render --
      it reuses the tracking from this render instead of starting over.</p>
  </div>

  <p id="error-message" hidden></p>

  <script src="/static/app.js"></script>
</body>
</html>
